[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "micm"
version = "0.1.0"
description = "Control mapping versus decoder quality in motor-imagery BCI, measured offline."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=14",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "scikit-learn>=1.4",
    "mne>=1.6",
    "moabb>=1.1",
    "pyriemann>=0.6",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "joblib>=1.3",
]

[project.optional-dependencies]
# Deep-learning stack is isolated so the mapping/env half of the project can be
# installed and iterated on without pulling in torch. Needed from T5 (EEGNet) on.
dl = [
    "torch>=2.2",
    "braindecode>=0.8",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: takes more than a few seconds, excluded from the default smoke loop",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N", "ARG", "PTH"]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]  # pytest fixtures are injected but not always referenced

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["micm"]
strict = true
warn_unreachable = true
disallow_any_generics = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "moabb.*",
    "mne.*",
    "pyriemann.*",
    "braindecode.*",
    "statsmodels.*",
    "matplotlib.*",
    "joblib.*",
    "hydra.*",
    "sklearn.*",
    "scipy.*",
]
ignore_missing_imports = true
