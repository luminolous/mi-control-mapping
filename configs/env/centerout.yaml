# Sequential center-out reaching, eight targets, static obstacles.
#
# The speed limit is the parameter that decides whether the task is solvable at
# all. A burst holds one command for `burst_s`, so a perfect decoder travels
# `v_max * burst_s` in a straight line before it can change direction. With four
# directions and eight targets a diagonal target is approached in a staircase,
# and the staircase settles into a limit cycle whose amplitude is roughly that
# per-burst step. Capture therefore needs the step to be no larger than the
# target, which is what ties v_max to target_radius below.
# See docs/decisions.md D28.

name: centerout

n_targets: 8
radius: 1.0
target_radius: 0.15

# Momentary contact is reachable by drift, so an acquisition needs the robot to
# stay inside continuously.
dwell_s: 0.5

# Measured, not derived. Mappings differ in how fast they command: S1 always
# issues v_max, S2 issues v_max * |sum_k p_k d_k| which measures about 0.65 of
# it on real posteriors, and S2 with entropy scaling about 0.47. A timeout tight
# enough to bind therefore records the cautious mappings as failing rather than
# as slow, which puts a speed artefact inside success_rate, the headline metric
# of H1 and H2. See docs/decisions.md D42a.
#
# Swept on subject 1 at the bottom of the quality sweep, eight targets, real
# cached posteriors, success rate against timeout:
#
#   timeout    S1     S2   S2ent    S3
#      150   0.875  0.792  0.708  0.917
#      300   1.000  0.958  0.958  1.000
#      450     -      -    1.000    -      (8 seeds)
#      600   1.000  1.000  1.000  1.000
#
# Every mapping is at its plateau by 450 s. 600 s leaves margin, and costs
# almost nothing: an episode that succeeds finishes early and never reaches its
# timeout, so wall time was flat from 450 s to 1200 s.
timeout_s: 600.0

# Continue from where the previous target was acquired rather than teleporting
# back to the centre, which would make every attempt identical and discard the
# sequencing the task is meant to exercise.
reset_between_targets: false

# 100 Hz, zero-order hold between the 4 Hz decoder updates.
dt: 0.01

# A burst does NOT carry a command for its whole 3.5 s. The first window needs
# 2 s of data before any estimate exists, and the latency buffer holds it for a
# further 250 ms, so a command is available for 3.5 - 2.0 - 0.25 = 1.25 s.
#
# 0.15 * 1.25 = 0.1875 per burst, or 1.25 target radii. The usable window is
# narrow and was found by measurement, not derived: at exactly one target radius
# per burst the oracle stalls on a diagonal target and fails it even with the
# timeout raised to 200 s, because the staircase straddles the target instead of
# settling in it. `test_the_oracle_ceiling_holds_across_seeds` is the authority
# here; the analytic bound in the tests is only a coarse guard.
# See docs/decisions.md D34.
v_max: 0.15

# First-order actuator lag. Off by default: a second-order arm adds tuning
# burden and moves no result.
tau: 0.0

obstacles:
  # Placed off the target circle and away from the centre, so they obstruct the
  # diagonal approaches without making any target unreachable.
  positions: [[0.45, 0.45], [-0.45, -0.45], [0.45, -0.45]]
  radius: 0.12
  # Per-seed positional noise. Zero keeps the layout fixed across seeds.
  jitter: 0.0
