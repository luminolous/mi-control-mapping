# Values shared by every experiment. Keys under `paths`, `device`, `n_workers`,
# `logging`, and `progress_every` are excluded from the config hash because they
# cannot change any number a run produces. See src/micm/utils/hashing.py.

seed: 1337

# Two, not three. There is no processed-epoch stage: filtering, epoching and
# standardisation run in process inside epoch_subject, and the cache boundary of
# this project is the posterior .npz rather than an epoch file. See
# docs/decisions.md D54.
paths:
  data_raw: data/raw
  artifacts: artifacts

# Falls back to cpu with a loud warning, never silently.
device: cuda
n_workers: 8

logging:
  level: INFO

# How many episodes between runner progress lines.
progress_every: 100

# Score intervals in summary.json. Not excluded from the config hash: these
# change the numbers the summary reports.
aggregate:
  # Subjects are resampled, never episodes; see src/micm/eval/aggregate.py.
  n_boot: 1000
  ci: 0.95
  # Below this a between-subject interval is not defined and the entry says so
  # rather than reporting a zero-width one that looks like precision.
  min_subjects: 3
