# @package _global_
#
# Placed at the global package: a config under configs/experiment/ would
# otherwise be nested under an `experiment` key by Hydra's directory-based
# package inference, and every path in the runner would need that prefix.
#
# Does the decoding window length change which mapping wins? A longer window
# decodes better and updates no less often, but it also delays the first command
# of every burst, so the two effects pull against each other.
#
# Each window needs its own posterior cache, which is why each is a replay
# variant with its own hash. Three of them: 1 s, the 2 s main condition, and
# 3 s, which is the longest that fits inside a 3.5 s trial.
#
# 3 windows x 4 mappings x 9 subjects x 5 seeds = 540 episodes.

defaults:
  - /matrix_defaults
  - /replay@replay_variants.burst_w1000: burst
  - /replay@replay_variants.burst_w3000: burst
  - _self_

name: ablation_window

# The window overrides sit here rather than in the replay group, because the
# group describes a protocol and the same protocol runs at every window.
replay_variants:
  burst_w1000:
    window_s: 1.0
    posterior_hash:
      riemann: null
  burst_w3000:
    window_s: 3.0
    posterior_hash:
      riemann: null

grid:
  subjects: [1, 2, 3, 4, 5, 6, 7, 8, 9]
  decoders: [riemann]
  mappings: [s1_argmax, s2_weighted, s3_evidence, s4_shared]
  quality_levels: [0.0]
  protocols: [burst]
  windows_s: [1.0, 2.0, 3.0]
  error_structures: [none]
  intent_modes: [null]
  alphas: [null]
  latencies_ms: [250]
  seeds: 5
