# @package _global_
#
# Placed at the global package: a config under configs/experiment/ would
# otherwise be nested under an `experiment` key by Hydra's directory-based
# package inference, and every path in the runner would need that prefix.
#
# H1: does the correlation between offline kappa and closed-loop performance
# depend on the mapping? Three decoders spanning the kappa range, all four
# mappings, every subject, and no perturbation at all: quality level 0 is the
# decoder as it actually is.
#
# 3 decoders x 4 mappings x 9 subjects x 10 seeds = 1080 episodes.

defaults:
  - /matrix_defaults
  - _self_

name: main

grid:
  subjects: [1, 2, 3, 4, 5, 6, 7, 8, 9]
  decoders: [fbcsp, riemann, eegnet]
  mappings: [s1_argmax, s2_weighted, s3_evidence, s4_shared]
  # Level 0 is the untouched decoder. H1 is about the decoders as they are.
  quality_levels: [0.0]
  protocols: [burst]
  windows_s: [2.0]
  error_structures: [none]
  intent_modes: [null]
  alphas: [null]
  latencies_ms: [250]
  seeds: 10
