# @package _global_
#
# Placed at the global package: a config under configs/experiment/ would
# otherwise be nested under an `experiment` key by Hydra's directory-based
# package inference, and every path in the runner would need that prefix.
#
# H2: over the kappa range 0.4 to 0.7, does changing the mapping buy more than
# improving the decoder? One decoder, swept across the quality levels, so the
# decoder axis is a controlled dial rather than three fixed points.
#
# 1 decoder x 4 mappings x 9 subjects x 6 levels x 10 seeds = 2160 episodes.

defaults:
  - /matrix_defaults
  - _self_

name: lambda_sweep

grid:
  subjects: [1, 2, 3, 4, 5, 6, 7, 8, 9]
  # The lowest-baseline decoder, measured. Oracle mixing only raises accuracy,
  # so the sweep starts at that decoder's own level and moves up, and the lowest
  # start sweeps the longest range.
  #
  # This was chosen as the middle decoder of three. It is now the weakest: after
  # the EEGNet fixes in D20 and D21 the three sit within 0.054 kappa of each
  # other, with riemann at 0.412 the lowest. Same choice, opposite reason.
  # See docs/decisions.md D22b.
  decoders: [riemann]
  mappings: [s1_argmax, s2_weighted, s3_evidence, s4_shared]
  # Read from the quality group rather than repeated here, so the levels the
  # sweep runs and the levels the mixing solves for cannot drift apart.
  quality_levels: ${quality.levels}
  protocols: [burst]
  windows_s: [2.0]
  error_structures: [none]
  intent_modes: [null]
  alphas: [null]
  latencies_ms: [250]
  seeds: 10
