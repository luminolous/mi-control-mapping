# @package _global_
#
# Placed at the global package: a config under configs/experiment/ would
# otherwise be nested under an `experiment` key by Hydra's directory-based
# package inference, and every path in the runner would need that prefix.
# Smoke run: synthetic posteriors, one subject, one mapping, two episodes.
#
# Exists so that "I could not run it" is never a reason for delivering
# unexecuted code. It exercises the whole path from posterior to
# episodes.parquet and summary.json, including the writer. It is not evidence
# that any result is correct.
#
# Must finish in under five seconds, which is why the target count, the burst
# budget, and the sanity episode counts are all cut down here.

defaults:
  - /base
  - /data: bci2a
  - /replay: burst
  - /quality: gap_fraction
  - /env: centerout
  # Every mapping the grid may name, each under its own key, because the grid
  # varies the mapping and a single composed group could only hold one.
  - /mapping@mappings.s1_argmax: s1_argmax
  - /mapping@mappings.s2_weighted: s2_weighted
  - /mapping@mappings.s2_weighted_entropy: s2_weighted_entropy
  - /mapping@mappings.s3_evidence: s3_evidence
  - /mapping@mappings.s4_shared: s4_shared
  - _self_

name: smoke

# No dataset, no cache files. Posteriors are generated in process.
synthetic:
  enabled: true
  n_bursts: 24
  n_windows: 7
  accuracy: 0.75
  confidence: 0.7

# Read only when `synthetic.enabled` is false. Null rather than `???`, because
# a mandatory-missing value breaks config hashing, and the hash has to work for
# a synthetic run too.
session: E
posterior_hash: null

grid:
  subjects: [1]
  decoders: [synthetic]
  mappings: [s1_argmax, s2_weighted, s3_evidence, s4_shared]
  quality_levels: [1.0]
  protocols: [burst]
  error_structures: [none]
  intent_modes: [null]
  # Null rather than NaN: a NaN in the config would break the config hash,
  # which serialises to JSON with allow_nan disabled on purpose. The episode
  # column is still NaN, which is what the output contract asks for.
  # Null means every mapping keeps its configured value. An alpha or intent
  # sweep is an S4-only experiment, because setting either on a grid that also
  # contains argmax would name a parameter argmax does not have.
  alphas: [null]
  latencies_ms: [250]
  seeds: 1

# Parameters of the structured-error variants, read when error_structures
# names one of them.
error_structure:
  smoothing_eps: 0.3
  jitter_windows: 2
  burst_p_flip: 0.2
  burst_mean_len: 3.0

sanity:
  # The oracle posterior is one-hot, so one episode settles it per mapping.
  oracle_episodes: 1
  # The chance floor is a rate, and with a handful of targets a single episode
  # can only report multiples of 1/n_targets. Several episodes give it enough
  # resolution to sit meaningfully below the threshold.
  chance_episodes: 3
  oracle_threshold: 0.95
  chance_threshold: 0.3

# Three targets rather than eight, and a shorter timeout, to stay inside the five
# second budget. Everything else is the real environment. The size is not
# arbitrary: at two targets a success rate can only be 0, 0.5 or 1, so the 0.3
# chance threshold is unreachable except at exactly zero and the check stops
# meaning anything.
#
# The timeout here is far tighter than the real 600 s, so the mappings that
# modulate their command magnitude will appear to fail in the smoke grid. That
# is the timeout, not the mapping. The sanity checks are unaffected: they use a
# one-hot posterior, on which every mapping commands at full speed.
env:
  n_targets: 3
  timeout_s: 75.0
